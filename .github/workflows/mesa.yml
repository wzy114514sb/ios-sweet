name: mesa

# The software OpenGL ES implementation the window server needs.
#
# CoreAnimation draws nothing on this port: every surface backboardd presents is
# black (measured with patch 0089), because there is no renderer - no Metal
# without a GPU driver, and Apple's OpenGL ES cannot draw either.  HackiOS
# (oosexgang/hackios-xnu-userland) shows the way: CA has an OpenGL ES renderer,
# and behind it any GL implementation will do.
#
#   build        Mesa 25.0.7 with the softpipe gallium driver (plain C, no LLVM,
#                no GPU) as /redwood/lib/libOSMesa.8.dylib, plus the list of gl*
#                it exports and gl.xml (the inputs the EAGL shim generator needs)
#   redwood-gl   libredwood-gl.dylib: HackiOS's eagl.c + gl_osmesa.c, which
#                replace the six -[EAGLContext ...] methods CoreAnimation asks
#                for and hand the drawing to OSMesa.  It has its own
#                constructor, so loading it into backboardd is enough.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: Mesa release to build
        default: "25.0.7"
  push:
    branches: [main, perseus]
    paths:
      - "tools/mesa/**"
      - "tools/redwood/**"
      - ".github/workflows/mesa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install -q meson ninja bison flex pkg-config
          python3 -m venv venv
          ./venv/bin/pip install -q mako pyyaml packaging
          echo "SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          clang --version | head -2

      - name: Fetch Mesa
        env:
          VERSION: ${{ github.event.inputs.mesa_version || '25.0.7' }}
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -sL --fail -o mesa-$VERSION.tar.xz https://archive.mesa3d.org/mesa-$VERSION.tar.xz
          tar xJf mesa-$VERSION.tar.xz
          for p in "$GITHUB_WORKSPACE"/tools/mesa/*.patch; do
            echo "applying $(basename "$p")"
            patch -s --no-backup-if-mismatch -d mesa-$VERSION -p1 < "$p"
          done

      - name: Configure
        env:
          VERSION: ${{ github.event.inputs.mesa_version || '25.0.7' }}
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          cat > cross.ini <<INI
          [binaries]
          c = ['clang', '-arch', 'arm64', '-isysroot', '$SDK', '-miphoneos-version-min=15.0']
          cpp = ['clang++', '-arch', 'arm64', '-isysroot', '$SDK', '-miphoneos-version-min=15.0']
          objc = ['clang', '-arch', 'arm64', '-isysroot', '$SDK', '-miphoneos-version-min=15.0']
          ar = 'ar'
          ranlib = 'ranlib'
          strip = 'strip'
          pkg-config = 'false'

          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          INI
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          meson setup build mesa-$VERSION --cross-file cross.ini --wrap-mode=nofallback \
            --prefix=/redwood --libdir=lib --buildtype=release -Db_ndebug=true \
            -Dplatforms= -Dgallium-drivers=softpipe -Dvulkan-drivers= -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dosmesa=true -Dllvm=disabled -Dshared-glapi=enabled -Dgles1=disabled -Dgles2=enabled -Dopengl=true \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dlibunwind=disabled -Dglvnd=disabled -Dvideo-codecs= -Dtools= -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled -Dgallium-xa=disabled -Dlmsensors=disabled -Dbuild-tests=false

      - name: Build
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          export PATH="$GITHUB_WORKSPACE/venv/bin:$PATH"
          ninja -C build src/gallium/targets/osmesa/libOSMesa.8.dylib 2>&1 | tail -40
          mkdir -p out
          xcrun strip -x -o out/libOSMesa.8.dylib build/src/gallium/targets/osmesa/libOSMesa.8.dylib
          install_name_tool -id /redwood/lib/libOSMesa.8.dylib out/libOSMesa.8.dylib
          ls -l out/
          nm -gU out/libOSMesa.8.dylib | awk '$3 ~ /^_gl/ { print substr($3, 2) }' > out/exported-gl.txt
          wc -l out/exported-gl.txt
          cp mesa-*/src/mapi/glapi/registry/gl.xml out/gl.xml

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-osmesa
          path: |
            ${{ runner.temp }}/out/libOSMesa.8.dylib
            ${{ runner.temp }}/out/exported-gl.txt
            ${{ runner.temp }}/out/gl.xml

  redwood-gl:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mesa-osmesa
          path: mesa-out

      - name: Build the EAGL shim
        run: |
          set -eux
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd mesa-out
          ls -l
          python3 "$GITHUB_WORKSPACE/tools/redwood/mkeagl.py" \
            "$GITHUB_WORKSPACE/tools/redwood/eagl_slots.txt" gl.xml exported-gl.txt \
            "$GITHUB_WORKSPACE/tools/redwood/eagl.c" > eagl_gen.h
          wc -l eagl_gen.h
          clang -dynamiclib -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -install_name /redwood/lib/libredwood-gl.dylib \
            -I. -I"$GITHUB_WORKSPACE/tools/redwood" \
            -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc \
            "$GITHUB_WORKSPACE/tools/redwood/eagl.c" \
            "$GITHUB_WORKSPACE/tools/redwood/gl_osmesa.c" \
            libOSMesa.8.dylib -o libredwood-gl.dylib 2>&1 | tail -30
          ls -l libredwood-gl.dylib
          otool -L libredwood-gl.dylib | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: redwood-gl
          path: |
            ${{ runner.temp }}/mesa-out/libredwood-gl.dylib
            ${{ runner.temp }}/mesa-out/eagl_gen.h
            ${{ runner.temp }}/mesa-out/libOSMesa.8.dylib
